# Career-Ops Profile Configuration (한국어 맞춤 예시)
# 이 파일을 config/profile.yml 로 복사하여 본인의 정보로 수정해 사용하세요.
# 모든 평가, 자기소개서, 이력서, 면접 준비의 단일 진실 공급원(Single Source of Truth)입니다.

candidate:
  full_name: "홍길동"
  # 이력서 상단 이름 바로 아래 노출되는 직무 타이틀
  title: "시니어 백엔드 엔지니어 (Senior Backend Engineer)"
  email: "gildong.hong@example.com"
  phone: "010-1234-5678"
  location: "대한민국 서울"
  linkedin: "linkedin.com/in/gildong-hong"
  portfolio_url: "https://gildong.dev"
  github: "github.com/gildong-hong"
  # PDF 이력서 증명사진 경로 (선택 사항, 필요 시 로컬 이미지 경로 입력)
  photo: ""
  photo_style: rounded

target_roles:
  # 집중 공략할 핵심 목표 역할 (North Star)
  primary:
    - "Senior Backend Engineer"
    - "Platform Engineer"
    - "AI/LLM Application Engineer"
  # 평가 시스템이 적합도를 채점하는 데 사용하는 아키타입
  archetypes:
    - name: "Backend Engineer"
      level: "Senior"
      fit: "primary"        # primary: 최우선 목표, secondary: 적합, adjacent: 도전/인접
    - name: "Platform / DevOps Engineer"
      level: "Mid-Senior"
      fit: "secondary"
    - name: "AI Application Engineer"
      level: "Mid-Senior"
      fit: "adjacent"

narrative:
  # 1줄 프로필 헤드라인
  headline: "대규모 트래픽 처리와 안정적인 마이크로서비스를 설계하는 백엔드 엔지니어"
  # 전환 스토리 (나만의 차별화된 서사)
  exit_story: "MAU 100만 이커머스 시스템의 아키텍처 개편을 주도하며 성능 40% 개선 달성. 이제 글로벌 스케일의 백엔드 및 AI 파이프라인으로 확장하고자 합니다."
  # 핵심 무기 / 강점 (3~5가지)
  superpowers:
    - "대규모 트래픽 환경에서의 분산 시스템 아키텍처 및 RDBMS/NoSQL 최적화"
    - "CI/CD 파이프라인 자동화 및 클라우드(AWS/GCP) 인프라 비용 절감"
    - "도메인 주도 설계(DDD) 및 테스트 주도 개발(TDD) 기반 클린 코드 작성"
  # 정량적 임팩트를 보여주는 프로젝트 / Proof Points (cv.md와 일치해야 함)
  proof_points:
    - name: "주문 결제 시스템 비동기 MSA 전환"
      url: "https://gildong.dev/projects/order-msa"
      hero_metric: "주문 피크 트래픽 지연 시간 60% 단축 (P99 800ms -> 320ms)"
    - name: "오픈소스 모니터링 라이브러리"
      url: "https://github.com/gildong-hong/fast-metrics"
      hero_metric: "GitHub Star 500+ 달성"

compensation:
  target_range: "8,000만원 - 1억 2,000만원"   # 희망 총 보상 (세전)
  currency: "KRW"
  minimum: "7,000만원"                       # 마지노선 연봉
  location_flexibility: "재택근무 선호, 서울/판교 하이브리드(주 1~2회 출근) 가능"

location:
  country: "대한민국"
  city: "서울"
  timezone: "KST"
  visa_status: "내국인 (취업 비자 불필요)"
  authorized_in: ["대한민국"]
  needs_sponsorship: false

language:
  # 리포트, 트래커 노트, PDF, 커버레터의 기본 출력 언어
  output: ko
  # 한국 채용 시장 특화 모드 활성화
  modes_dir: modes/ko

follow_ups:
  enabled: true
